services:
  # Host port bindings live in docker-compose.yml (loopback by default);
  # Compose concatenates `ports`, so they must not be repeated here.
  app:
    environment:
      CONTROL_PLANE_BIND: "0.0.0.0"
    restart: always

  web:
    restart: always

  security:
    restart: always

  postgres:
    restart: always

  seaweedfs:
    restart: always
    ports:
      - "127.0.0.1:${SEAWEEDFS_ADMIN_PORT:-9333}:9333"
