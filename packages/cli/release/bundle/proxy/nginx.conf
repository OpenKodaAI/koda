# Koda publishes the dashboard and the control-plane API on 127.0.0.1 only;
# proxy to the IPv4 loopback address explicitly (`localhost` may resolve to ::1).
# Include this file in nginx's http context (for example /etc/nginx/conf.d/) and
# terminate TLS here: operator session cookies are `Secure`.
#
# Routing follows the auth model (docs/install/vps.md, "Reverse Proxy"):
# - Browsers talk only to the dashboard (:3000). It turns the HTTP-only session
#   cookie into the API's bearer token, so pages (/, /setup, /login,
#   /forgot-password, /control-plane) and the browser-facing /api/control-plane/*
#   and /api/runtime/* routes, the runtime relay WebSocket included, go there.
# - API-token clients send `Authorization: Bearer`. Only those requests to
#   /api/control-plane/*, and /openapi/control-plane.json, go to the API (:8090).
# - Every request adds the address it came from to X-Forwarded-For, so
#   WEB_TRUSTED_PROXIES and CONTROL_PLANE_TRUSTED_PROXIES charge rate limits to
#   the real client.

map $http_upgrade $koda_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # Dashboard: pages and the browser-facing /api/runtime/* routes.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Browser calls (session cookie) go to the dashboard; API-token calls to the API.
    location /api/control-plane/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        error_page 418 = @koda_control_plane_api;
        if ($http_authorization ~* "^Bearer\s") {
            return 418;
        }
    }

    # Runtime relay WebSocket (terminal and browser panels), kept open while idle.
    location /api/runtime/relay/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $koda_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /openapi/control-plane.json {
        proxy_pass http://127.0.0.1:8090/openapi/control-plane.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Control-plane API, entered only from /api/control-plane/ with a bearer token.
    location @koda_control_plane_api {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
