# Koda publishes the dashboard and the control-plane API on 127.0.0.1 only;
# proxy to the IPv4 loopback address explicitly (`localhost` may resolve to ::1).
# Include this file in nginx's http context (for example /etc/nginx/conf.d/) and
# terminate TLS here: operator session cookies are `Secure`.
#
# Routing follows the auth model (docs/install/vps.md, "Reverse Proxy"):
# - Browsers talk only to the dashboard (:3000). It turns the HTTP-only session
#   cookie into the API's bearer token, so pages (/, /setup, /login,
#   /forgot-password, /control-plane) and the browser-facing /api/control-plane/*
#   and /api/runtime/* routes, the runtime relay WebSocket included, go there.
# - API-token clients send `Authorization: Bearer`. Only those requests to
#   /api/control-plane/*, and /openapi/control-plane.json, go to the API (:8090).
# - Every request adds the address it came from to X-Forwarded-For, so
#   WEB_TRUSTED_PROXIES and CONTROL_PLANE_TRUSTED_PROXIES charge rate limits to
#   the real client.
# - Every request keeps the Host the browser sent, port included ($http_host, not
#   $host), and its scheme in X-Forwarded-Proto: the dashboard accepts a sign-in
#   or any other change only when its Origin matches them. A request that came
#   without a Host (an HTTP/1.0 health check) gets the server name instead: it is
#   proxied as HTTP/1.1, which the dashboard refuses without a Host.
# - Every request the dashboard gets keeps the http context's client_max_body_size
#   (nginx's default is 1m): the dashboard buffers a body before it checks anything,
#   so a larger limit would let a client without a session make it hold big bodies.
#   Its own photo uploads fit: the photo editors send a cropped 512-pixel JPEG. Only
#   an API-token upload to the two photo routes may be larger, as a profile or room
#   photo may be 12 MiB, sent as a multipart form: those requests go to the API, which
#   checks the token before it reads the body, and take up to 13 MiB (the photo plus
#   room for the form around it).

map $http_upgrade $koda_connection_upgrade {
    default upgrade;
    ""      close;
}

map $http_host $koda_proxy_host {
    default $http_host;
    ""      $host;
}

server {
    # Set your domain and TLS here, e.g. `listen 443 ssl;` with ssl_certificate and
    # ssl_certificate_key, and `server_name koda.example.com;`. With `server_name _`
    # a request for your domain goes to the default server of its port, which is
    # the distribution's stock site where one is enabled (Debian and Ubuntu ship
    # sites-enabled/default with `listen 80 default_server`).
    listen 80;
    server_name _;

    # API-token photo uploads, the only requests that may carry more than 1m. nginx
    # checks a declared Content-Length against the location it selects, before any
    # `if` in that location runs, so the token is checked here, before the selection:
    # the rewrite sends these requests to the internal upload location below.
    if ($http_authorization ~* "^Bearer\s") {
        rewrite "^/api/control-plane/(auth/profile/photo|dashboard/squads/threads/[^/]+/photo)$" /koda-api-photo-upload/$1 last;
    }

    # Dashboard pages.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $koda_proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Browser calls (session cookie) go to the dashboard; API-token calls to the API.
    location /api/control-plane/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $koda_proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        error_page 418 = @koda_control_plane_api;
        if ($http_authorization ~* "^Bearer\s") {
            return 418;
        }
    }

    # Browser-facing runtime routes. The event streams (/api/runtime/agents/*/stream)
    # send no heartbeat, so an idle one is kept open past nginx's default 60 s; the
    # dashboard turns buffering off for them (X-Accel-Buffering: no).
    location /api/runtime/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $koda_proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # Runtime relay WebSocket (terminal and browser panels), kept open while idle.
    location /api/runtime/relay/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $koda_proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $koda_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /openapi/control-plane.json {
        proxy_pass http://127.0.0.1:8090/openapi/control-plane.json;
        proxy_http_version 1.1;
        proxy_set_header Host $koda_proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Control-plane API, entered only from /api/control-plane/ with a bearer token.
    location @koda_control_plane_api {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $koda_proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Photo uploads with a bearer token, entered only through the rewrite at the top:
    # a client asking for /koda-api-photo-upload/ itself gets 404. nginx checks a
    # declared Content-Length here, and a chunked (or HTTP/2) body while it reads it,
    # here too. proxy_pass puts the /api/control-plane/ prefix back.
    location /koda-api-photo-upload/ {
        internal;
        client_max_body_size 13m;
        proxy_pass http://127.0.0.1:8090/api/control-plane/;
        proxy_http_version 1.1;
        proxy_set_header Host $koda_proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
